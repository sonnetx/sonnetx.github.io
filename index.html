<head>
    <meta charset="UTF-8">

    <title>Sonnet Xu</title>
    <style>
        :root {
            --text-color: #333;
            --link-color: #0066cc;
            --border-color: #e0e0e0;
            --max-width: 650px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-color);
            background: #fff;
            padding: 40px 20px;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        /* Header */
        header {
            margin-bottom: 60px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .tagline {
            color: #666;
            font-style: italic;
            font-size: 16px;
        }

        /* Navigation */
        nav {
            margin: 40px 0 60px;
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 16px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--link-color);
        }

        /* Post List */
        .post-list {
            margin-bottom: 60px;
        }

        .post-item {
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-date {
            color: #999;
            font-size: 14px;
            margin-bottom: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .post-title {
            font-size: 24px;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .post-title a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.2s;
        }

        .post-title a:hover {
            color: var(--link-color);
        }

        .post-excerpt {
            color: #555;
            line-height: 1.7;
        }

        .read-more {
            display: inline-block;
            margin-top: 10px;
            color: var(--link-color);
            text-decoration: none;
            font-size: 16px;
        }

        .read-more:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            margin-top: 80px;
            padding-top: 40px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: #999;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                font-size: 16px;
                padding: 20px 15px;
            }

            h1 {
                font-size: 28px;
            }

            .post-title {
                font-size: 20px;
            }

            nav ul {
                gap: 20px;
            }
        }
    </style>
</head>
