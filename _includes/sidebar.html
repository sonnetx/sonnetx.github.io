<a class="skip-link" href="#workspace-content">Skip to content</a>
<header class="workspace-header">
    <a class="workspace-brand" href="/" aria-label="Sonnet Xu, home"><span class="brand-mark" aria-hidden="true">s<span>_</span></span><span>sonnet<span class="muted">@stanford</span></span></a>
    <span class="workspace-label">a personal workspace</span>
    <button class="command-trigger" type="button" data-open-command hidden aria-label="Open command menu">&gt;_ <span>jump to</span> <kbd>Ctrl K</kbd></button>
</header>
<nav class="workspace-nav" aria-label="Main navigation">
    <a href="/"{% if include.active == "home" %} aria-current="page"{% endif %}><span aria-hidden="true">~/</span>home</a>
    <a href="/research.html"{% if include.active == "research" %} aria-current="page"{% endif %}>research<span class="nav-extension">.md</span></a>
    <a href="/projects.html"{% if include.active == "projects" %} aria-current="page"{% endif %}>projects<span aria-hidden="true">/</span></a>
    <a href="/reading.html"{% if include.active == "reading" %} aria-current="page"{% endif %}>reading<span class="nav-extension">.txt</span></a>
    <a href="/about.html"{% if include.active == "about" %} aria-current="page"{% endif %}>about<span class="nav-extension">.me</span></a>
    <a class="nav-contact" href="/contact.html"{% if include.active == "contact" %} aria-current="page"{% endif %}>say hello <span aria-hidden="true">↗</span></a>
</nav>
<div id="workspace-content" tabindex="-1"></div>
<dialog class="command-dialog" aria-labelledby="command-title">
    <div class="dialog-heading"><h2 id="command-title">Where to?</h2><button type="button" data-close-command aria-label="Close command menu">esc ×</button></div>
    <p>Type a page name, or select a destination.</p>
    <form class="command-form"><label for="palette-command">sonnet:~ $</label><input id="palette-command" name="command" autocomplete="off" spellcheck="false" placeholder="try research" required><button type="submit" aria-label="Run command">↵</button></form>
    <p class="command-response" role="status"></p>
    <nav class="command-destinations" aria-label="Jump to page"><a href="/">home</a><a href="/research.html">research</a><a href="/projects.html">projects</a><a href="/compute/">compute</a><a href="/reading.html">reading</a><a href="/about.html">about</a><a href="/community.html">community</a><a href="/contact.html">contact</a></nav>
</dialog>
<script src="/workspace.js" defer></script>
