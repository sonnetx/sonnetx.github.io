<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Sonnet Xu</title>
    <style>
        :root {
            --text-color: #333;
            --link-color: #0066cc;
            --border-color: #e0e0e0;
            --max-width: 650px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-color);
            background: #fff;
            padding: 40px 20px;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .site-header {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .site-title {
            font-size: 20px;
            font-weight: normal;
        }

        .site-title a {
            color: var(--text-color);
            text-decoration: none;
        }

        .site-title a:hover {
            color: var(--link-color);
        }

        .page-title {
            font-size: 36px;
            font-weight: normal;
            margin-bottom: 40px;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            color: #999;
            font-style: italic;
            margin: 60px 0;
        }

        .year-section {
            margin-bottom: 50px;
        }

        .year-title {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .archive-list {
            list-style: none;
        }

        .archive-item {
            margin-bottom: 15px;
            display: flex;
            align-items: baseline;
        }

        .archive-date {
            color: #999;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-width: 80px;
            margin-right: 20px;
        }

        .archive-link {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.2s;
        }

        .archive-link:hover {
            color: var(--link-color);
        }

        footer {
            margin-top: 80px;
            padding-top: 40px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: #999;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        @media (max-width: 600px) {
            body {
                font-size: 16px;
                padding: 20px 15px;
            }

            .page-title {
                font-size: 28px;
            }

            .archive-item {
                flex-direction: column;
            }

            .archive-date {
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="site-header">
            <h1 class="site-title"><a href="index.html">&larr; Sonnet Xu</a></h1>
        </header>

        <main>
            <h1 class="page-title">Blog</h1>

            <p class="empty-state">Coming soon.</p>

            <!-- Future posts go here:
            <div class="year-section">
                <h2 class="year-title">2026</h2>
                <ul class="archive-list">
                    <li class="archive-item">
                        <span class="archive-date">Apr 16</span>
                        <a href="posts/example.html" class="archive-link">Post Title Here</a>
                    </li>
                </ul>
            </div>
            -->
        </main>

        <footer>
            <p>&copy; 2026 Sonnet Xu. All rights reserved.</p>
        </footer>
    </div>
    <script data-goatcounter="https://sonnetx.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
