<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - Sonnet Xu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css">
    <link rel="stylesheet" href="/sidebar.css">
    <style>
        :root {
            --text-color: #333;
            --link-color: #0066cc;
            --border-color: #e0e0e0;
            --max-width: 760px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-color);
            background: #fff;
            padding: 40px 20px;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .page-title {
            font-size: 36px;
            font-weight: normal;
            margin-bottom: 40px;
        }

        .content p {
            margin-bottom: 25px;
        }

        .content a {
            color: var(--link-color);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .content a:hover {
            border-bottom-color: var(--link-color);
        }

        .content p:has(+ ul) {
            margin-bottom: 10px;
        }

        .content ul {
            margin: 0 0 25px 1.4em;
        }

        .content li {
            margin-bottom: 8px;
            padding-left: 4px;
        }

        /* Hover popups on words in the text: the book list (_includes/reading.html) and short
           notes (_includes/note.html). */
        .hover-note {
            position: relative;
            cursor: pointer;
            border-bottom: 1px dotted #999;
            -webkit-tap-highlight-color: transparent;
        }

        .hover-note:focus-visible {
            outline: 2px solid var(--link-color);
            outline-offset: 2px;
            border-radius: 2px;
        }

        .hover-note-card {
            display: none;
            position: absolute;
            left: 0;
            top: calc(100% + 8px);
            z-index: 10;
            width: min(320px, calc(100vw - 32px));
            padding: 12px 16px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            cursor: auto;
        }

        /* Covers the gap above the popup so the pointer can reach its link without closing it. */
        .hover-note-card::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 100%;
            height: 10px;
        }

        @media (hover: hover) {
            .hover-note:hover .hover-note-card {
                display: block;
            }
        }

        .hover-note:focus-visible .hover-note-card,
        .hover-note.open .hover-note-card {
            display: block;
        }

        .reading-label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #999;
        }

        .reading-book {
            display: block;
            margin-top: 4px;
        }

        .content .reading-more {
            display: inline-block;
            margin-top: 10px;
            font-size: 13px;
        }

        footer {
            margin-top: 80px;
            padding-top: 40px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: #999;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        @media (max-width: 600px) {
            body {
                font-size: 16px;
                padding: 20px 15px;
            }

            .page-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    {% include sidebar.html active="about" %}

    <div class="container">
        <main id="main-content">
            <p class="page-kicker">The person behind the papers</p>
            <h1 class="page-title">{{ page.title }}</h1>

            <div class="content">
{{ content }}
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Sonnet Xu. All rights reserved.</p>
        </footer>
    </div>
    <script>
        // Markdown links can't set a target, so open outside sites in a new tab here.
        document.querySelectorAll('.content a[href^="http"]').forEach(a => a.target = '_blank');

        // Hover popups. Tapping toggles one on phones. Its left edge is set before it opens so it
        // never runs off screen, using the same min(320px, 100vw - 32px) width as the CSS.
        document.querySelectorAll('.hover-note').forEach(el => {
            const popup = el.querySelector('.hover-note-card');
            const place = () => {
                const viewport = document.documentElement.clientWidth;
                const room = viewport - 16 - el.getBoundingClientRect().left;
                popup.style.left = `${Math.min(0, room - Math.min(320, viewport - 32))}px`;
            };
            el.addEventListener('mouseenter', place);
            el.addEventListener('focus', place);
            el.addEventListener('click', () => {
                place();
                el.classList.toggle('open');
            });
        });
        document.addEventListener('click', e => {
            document.querySelectorAll('.hover-note.open').forEach(el => {
                if (!el.contains(e.target)) el.classList.remove('open');
            });
        });
    </script>
    <script data-goatcounter="https://sonnetx.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
